<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A24"/>
      <stop offset="0.22" stop-color="#0A2540"/>
      <stop offset="0.48" stop-color="#173B70"/>
      <stop offset="0.78" stop-color="#DDEEFF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <radialGradient id="cyan" cx="68%" cy="56%" r="54%">
      <stop offset="0" stop-color="#00D2FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="24%" cy="34%" r="52%">
      <stop offset="0" stop-color="#635BFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
